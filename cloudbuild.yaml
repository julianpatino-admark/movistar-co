steps:
  - id: 'build-runtime-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv:
      - 'BITBUCKET_SSH_KEY'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - '-c'
      - |
        set -euo pipefail

        SSH_KEY_FILE="$$(mktemp)"
        trap 'rm -f "$$SSH_KEY_FILE"' EXIT

        printf '%s\n' "$$BITBUCKET_SSH_KEY" > "$$SSH_KEY_FILE"
        chmod 600 "$$SSH_KEY_FILE"

        docker build \
          --target runtime \
          --ssh "default=$$SSH_KEY_FILE" \
          --secret id=known_hosts,src=.cloudbuild/known_hosts.bitbucket \
          --tag "us-central1-docker.pkg.dev/$PROJECT_ID/movistar-landing/app:build-$BUILD_ID" \
          .

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/movistar-landing/app:build-$BUILD_ID'

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/bitbucket-ssh-key/versions/latest'
      env: 'BITBUCKET_SSH_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
