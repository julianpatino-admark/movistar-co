# must be unique in a given SonarQube instance
sonar.projectKey=EPIRON_co-bancolombia-asistencias

# --- optional properties ---

# defaults to project key
# sonar.projectName=Bancolombia asistencia virtual
# defaults to 'not provided'
sonar.projectVersion=1.0
 
# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources= .
 
# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.language=php

sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/**,tests/**,**/*.log,**/*.tmp,**/*.cache,**/*.config.js
sonar.coverage.exclusions=database/**, config/**, routes/**, bootstrap/**, tests/**, vendor/**, public/**, lang/**, app/Providers/**, app/Http/Middleware/**, app/Exceptions/**, playwright.config.ts, codecept.conf.ts, webpack.mix.js, gulpfile.js, steps*, resources/js/setup.js,resources/js/internet-movil.js

sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# ----------------------------------------------------
# 1. RUTAS DE LOS REPORTES DE COVERAGE
# ----------------------------------------------------
# Backend (El que generaste con php artisan)
sonar.php.coverage.reportPaths=build/logs/clover.xml

# Frontend (El que generaste con Playwright/Istanbul)
sonar.javascript.lcov.reportPaths=tests/e2e/coverage-reports/lcov.info

